name: Publish to npmjs.org

# Triggered by pushing a version tag (e.g. v0.1.0).
#
# Only @ancientpantheon/pythia-client publishes. The gateway service
# (apps/pythia) is private and is NEVER referenced in a publish step.
#
# The tag version MUST equal the root package.json's version — the unified
# version shared by root package.json, packages/pythia-client/package.json,
# apps/pythia/package.json, and apps/pythia/src/version.ts (enforced by
# apps/pythia/src/versionConsistency.test.ts, run below) — and the client's README +
# CHANGELOG must reference that version — otherwise the workflow fails before
# npm sees a single byte.
#
# One `v*` tag drives BOTH this workflow (npm publish of pythia-client) and
# image.yml (ghcr container build/push) — they run independently off the same
# tag push and are both gated on the same unified version.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish pythia-client
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `contents: write` lets `gh release create` publish a Release.
    # `id-token: write` enables `npm publish --provenance` (OIDC -> SLSA).
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Plain Node setup — no registry-url so setup-node doesn't write its own
      # scoped .npmrc. We write the root .npmrc ourselves in the next step.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Write .npmrc with auth token
        run: |
          cat > .npmrc <<EOF
          //registry.npmjs.org/:_authToken=${{ secrets.NPM_PUBLISHER }}
          @ancientpantheon:registry=https://registry.npmjs.org
          always-auth=true
          EOF
          echo "--- .npmrc structure (token redacted) ---"
          sed 's|=.*|=***|' .npmrc

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      # Belt-and-suspenders: typecheck + build + tests gate the publish so a
      # broken client never makes it to the registry.
      - name: Typecheck + Build + Test
        run: |
          npm run typecheck
          npm run build
          npm test

      # ------------------------------------------------------------------
      # Tag-version match: the tag MUST equal the unified root package.json
      # version (the single source of truth mirrored across all four
      # version-bearing files — see apps/pythia/src/versionConsistency.test.ts, which
      # ran as part of "Typecheck + Build + Test" above and would already
      # have failed the workflow if those four files disagreed).
      # If the tag doesn't match, the tag is wrong — fail before npm sees a
      # byte.
      # ------------------------------------------------------------------
      - name: Verify tag matches the SERVICE version + read the CLIENT version
        id: version
        run: |
          # The tag `vX.Y.Z` is the SERVICE version (root package.json). The CLIENT
          # (@ancientpantheon/pythia-client) has its OWN independent version — it only
          # moves when the client's source changes, so it may LAG the tag. We publish
          # the client at ITS OWN version (idempotent below), not the tag.
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          SERVICE_VERSION=$(node -p "require('./package.json').version")
          CLIENT_VERSION=$(node -p "require('./packages/pythia-client/package.json').version")
          echo "Tag / service version: $TAG_VERSION"
          echo "Client version:        $CLIENT_VERSION"
          # Defence-in-depth: both must be clean semver before reaching GITHUB_OUTPUT /
          # a downstream shell command.
          for v in "$SERVICE_VERSION" "$CLIENT_VERSION"; do
            if ! printf '%s' "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Version '$v' is not clean semver (x.y.z)."
              exit 1
            fi
          done
          if [ "$TAG_VERSION" != "$SERVICE_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match the SERVICE version $SERVICE_VERSION."
            echo "::error::Bump the service trio (package.json, apps/pythia/package.json, apps/pythia/src/version.ts) + root CHANGELOG to $TAG_VERSION before tagging."
            exit 1
          fi
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "CLIENT_VERSION=$CLIENT_VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # README + CHANGELOG version-parity gate (three greps).
      # ------------------------------------------------------------------
      - name: Verify the CLIENT's README + CHANGELOG mention the CLIENT version
        env:
          # The client's OWN version (may lag the tag). Pass via env, never spliced.
          CLIENT_VERSION: ${{ steps.version.outputs.CLIENT_VERSION }}
        run: |
          PKG_DIR="packages/pythia-client"
          # Escape the dots so each literal '.' matches a period, not any char.
          CLIENT_VERSION_RE="${CLIENT_VERSION//./\\.}"

          # README: ## Status block must reference the client version.
          if ! grep -qE "\`${CLIENT_VERSION_RE}\`[[:space:]]+on public npmjs" "${PKG_DIR}/README.md"; then
            echo "::error::${PKG_DIR}/README.md ## Status block does not lead with client version ${CLIENT_VERSION}"
            echo "::error::Expected: a line containing \`${CLIENT_VERSION}\` on public npmjs"
            exit 1
          fi
          echo "✓ ${PKG_DIR}/README.md ## Status block references ${CLIENT_VERSION}"

          # README: version history must contain a **vX.Y.Z** entry for the client version.
          if ! grep -qE "^\*\*v${CLIENT_VERSION_RE}\*\*[[:space:]]" "${PKG_DIR}/README.md"; then
            echo "::error::${PKG_DIR}/README.md version history is missing a **v${CLIENT_VERSION}** paragraph"
            exit 1
          fi
          echo "✓ ${PKG_DIR}/README.md version history contains **v${CLIENT_VERSION}** entry"

          # CHANGELOG: first ## heading must be the client version.
          FIRST_HEADING=$(grep -m1 '^## ' "${PKG_DIR}/CHANGELOG.md")
          if ! echo "$FIRST_HEADING" | grep -qE "^## ${CLIENT_VERSION_RE}[[:space:]]"; then
            echo "::error::${PKG_DIR}/CHANGELOG.md's first ## heading does not match client version ${CLIENT_VERSION}"
            echo "::error::First heading found: ${FIRST_HEADING}"
            exit 1
          fi
          echo "✓ ${PKG_DIR}/CHANGELOG.md leads with: ${FIRST_HEADING}"
          echo "All client documentation gates passed at v${CLIENT_VERSION}."

      - name: Verify npm auth
        run: |
          echo "Checking npm whoami..."
          npm whoami || echo "::warning::whoami failed — publish may too"

      # ------------------------------------------------------------------
      # Idempotent publish at the CLIENT's OWN version — skip if already on npm.
      # A service-only release leaves the client version unchanged, so it is
      # already published and this SKIPS (no needless republish). A real client
      # change bumps the client version → this publishes it.
      # ------------------------------------------------------------------
      - name: Publish @ancientpantheon/pythia-client to npmjs.org (only if its version is new)
        env:
          CLIENT_VERSION: ${{ steps.version.outputs.CLIENT_VERSION }}
        run: |
          if npm view @ancientpantheon/pythia-client@"${CLIENT_VERSION}" version >/dev/null 2>&1; then
            echo "@ancientpantheon/pythia-client@${CLIENT_VERSION} already on npm — client unchanged, skipping (idempotent)."
          else
            echo "Publishing @ancientpantheon/pythia-client@${CLIENT_VERSION} (client version is new)."
            npm publish --workspace=@ancientpantheon/pythia-client --access public --provenance
          fi

      - name: Create GitHub Release for the pushed tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists — skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-from-tag \
              --latest
            echo "Created GitHub Release for $TAG."
          fi
